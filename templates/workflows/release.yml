# AI Kickstart release workflow (03-execution §10). A vX.Y.Z tag on a commit of the main branch names the images
# CI already built, tested and published for that commit (sha-<commit>) with the version and creates the GitHub
# release. Nothing is rebuilt. On a self-hosted server that follows the latest X.Y.Z image, this tag IS the deploy.
#
# Copy to .github/workflows/release.yml and fill in the env block. Tag only after CI on the main branch is green for
# that commit: a commit without its sha-<commit> images fails before anything is published.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # the release
  packages: write # the X.Y.Z image tags

env:
  # In order, space separated. The server watches the LAST one: it gets the version last, so when it has it, all do.
  IMAGES: "ghcr.io/{{owner}}/{{app}}-api ghcr.io/{{owner}}/{{app}}-web"
  # A JSON file whose "version" must equal the tag (the version shown in the app), e.g. frontend/package.json.
  # Empty: no check.
  VERSION_FILE: ""
  # Notes for the release: <NOTES_DIR>/vX.Y.Z.md with a "## vX.Y.Z" heading. Missing: GitHub generates them.
  NOTES_DIR: internal_docs/Releases

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag, the version and the notes
        id: check
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"; version="${tag#v}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$tag is not vX.Y.Z"; exit 1; }
          if [ -n "$VERSION_FILE" ]; then
            have="$(jq -r .version "$VERSION_FILE")"
            [ "$have" = "$version" ] || { echo "::error::$VERSION_FILE says $have, the tag says $version: bump it in the release commit"; exit 1; }
          fi
          notes="$NOTES_DIR/$tag.md"
          if [ -f "$notes" ]; then
            grep -q "^## $tag" "$notes" || { echo "::error::$notes has no \"## $tag\" heading"; exit 1; }
            echo "notes=$notes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::no $notes: GitHub generates the notes from the commits"
            echo "notes=" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Name the images of this commit with the version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # All must exist before any is tagged: never a half-published version.
          for image in $IMAGES; do
            docker buildx imagetools inspect "$image:sha-$GITHUB_SHA" > /dev/null \
              || { echo "::error::$image:sha-$GITHUB_SHA is missing: wait for CI on the main branch before tagging"; exit 1; }
          done
          for image in $IMAGES; do
            docker buildx imagetools create -t "$image:$version" "$image:sha-$GITHUB_SHA"
          done

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ steps.check.outputs.notes }}
        run: |
          if [ -n "$NOTES" ]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$NOTES"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi
